name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  backend:
    name: Backend (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # prisma generate only reads the schema, it doesn't connect -- but it
      # does need these env vars to be resolvable, so dummy values are fine
      # for CI (no live database is used or needed here).
      DATABASE_URL: 'postgresql://user:password@localhost:5432/db'
      DIRECT_URL: 'postgresql://user:password@localhost:5432/db'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        run: npm run test
