services:
  db:
    image: postgres:16-alpine
    container_name: cloudops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops_dev_pw
      POSTGRES_DB: cloudops_simulator
    ports:
      - "5432:5432"
    volumes:
      - cloudops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops_simulator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudops_pgdata:
